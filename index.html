
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Midnight Academy</title>


<link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="topbar">

    <div class="academy-title">

      <h1 class="brand">
        THE MIDNIGHT ACADEMY
      </h1>

      <div class="subtitle">
        TECHNOLOGY EVOLUTION SIMULATION
      </div>

    </div>


    <div class="turn-info">

      <span>
        YEAR <strong id="year">2100</strong>
      </span>

      <span>
        ROUND <strong id="turn">1</strong>/10
      </span>

      <span>
        RESEARCH POINTS：
        <strong id="points">10</strong>
      </span>

      <button id="end-turn">
        END TURN
      </button>
      <button onclick="showBreakthrough('agi')">
TEST AGI
</button>
      

    </div>


  </header>

  <div class="notice">
    <strong>研究提示</strong>
    <p>发展某些学科，可能会促进其他学科的发展速度。</p >
  </div>

  <main class="layout">
    <section class="panel">
      <h2>基础学科</h2>
      <div id="subjects"></div>
    </section>

    <section class="panel">
      <h2>科技网络</h2>
      <p class="muted">选择一个节点，查看研究条件。</p >
      <div id="tech-map" class="tech-map"></div>
    </section>

    <section class="panel detail-panel">
      <h2>研究详情</h2>
      <div id="details">
        <p class="muted">请先选择一个研究节点。</p >
      </div>
    </section>
  </main>

  <footer class="footer">
    The Midnight Academy · 互动研究原型
</footer>


<!-- 科技突破事件窗口 -->
<div id="breakthrough-overlay">

    <div class="breakthrough-box">

        <div class="breakthrough-title">
            SYSTEM BREAKTHROUGH
        </div>


        <div id="breakthrough-tech">
            ARTIFICIAL GENERAL INTELLIGENCE
        </div>


        <div id="breakthrough-text">
            新时代的序幕已经开启。
        </div>

    </div>

</div>

<script>
 const breakthroughEvents = {

  agi: {

    title:
    "ARTIFICIAL GENERAL INTELLIGENCE",

    text:
    `
    新时代的序幕已经开启。

    人类第一次创造出能够跨越领域、
    持续学习并自主解决复杂问题的智能系统。

    AI时代结束。

    AGI时代开始。
    `

  },


  quantum: {

    title:
    "QUANTUM TECHNOLOGY",

    text:
    `
    微观世界的规则，
    开始成为人类文明的新工具。

    信息、计算与测量，
    正进入量子时代。
    `

  },


  fusion: {

    title:
    "CONTROLLED NUCLEAR FUSION",

    text:
    `
    人类第一次掌握恒星内部的能量。

    能源限制，
    开始逐渐退出文明发展的舞台。
    `

  },


  bci: {

    title:
    "BRAIN COMPUTER INTERFACE",

    text:
    `
    思维与机器之间，
    第一座桥梁已经建立。

    人类开始重新定义自身边界。
    `

  },


  embodiment: {

    title:
    "EMBODIED INTELLIGENCE",

    text:
    `
    智能第一次拥有真正的身体。

    机器开始理解、
    学习并参与现实世界。
    `

  }

};
 const subjects = [
  { id: "math", name: "数学", level: 1, progress: 0 },
  { id: "physics", name: "物理学", level: 1, progress: 0 },
  { id: "cs", name: "计算机科学", level: 1, progress: 0 },
  { id: "biology", name: "生物学", level: 1, progress: 0 },
  { id: "chemistry", name: "化学", level: 1, progress: 0 },
  { id: "control", name: "电子与控制工程", level: 1, progress: 0 }
];

  // 跨学科研究与十项目标科技
  const technologies = [
    {
      id: "materials",
      name: "材料科学",
      type: "跨学科研究",
      conditions: ["物理学 Lv.2", "化学 Lv.2"]
    },
    {
      id: "ai",
      name: "人工智能",
      type: "跨学科研究",
      conditions: ["数学 Lv.2", "计算机科学 Lv.2"]
    },
    {
      id: "bci",
      name: "脑机接口",
      type: "目标科技",
      conditions: ["生物学 Lv.2", "电子与控制工程 Lv.2"]
    },
    {
      id: "embodied",
      name: "具身智能",
      type: "目标科技",
      conditions: ["人工智能", "电子与控制工程 Lv.2"]
    },
    {
      id: "arvr",
      name: "AR/VR",
      type: "目标科技",
      conditions: ["计算机科学 Lv.2", "电子与控制工程 Lv.2"]
    },
    {
      id: "spaceplane",
      name: "空天飞机",
      type: "目标科技",
      conditions: [
        "数学 Lv.2",
        "物理学 Lv.2",
        "电子与控制工程 Lv.2",
        "材料科学"
      ]
    },
    {
      id: "gene",
      name: "基因治疗 / 改进",
      type: "目标科技",
      conditions: ["生物学 Lv.2", "化学 Lv.2"]
    },
    {
      id: "recycling",
      name: "资源再生",
      type: "目标科技",
      conditions: ["化学 Lv.2", "计算机科学 Lv.2"]
    },
    {
      id: "fusion",
      name: "可控核聚变",
      type: "目标科技",
      conditions: [
        "物理学 Lv.2",
        "化学 Lv.2",
        "材料科学",
        "电子与控制工程 Lv.2"
      ]
    },
    {
      id: "agi",
      name: "通用人工智能（AGI）",
      type: "目标科技",
      conditions: ["数学 Lv.3", "计算机科学 Lv.3", "人工智能 Lv.2"]
    },
    {
      id: "quantum",
      name: "量子科技",
      type: "目标科技",
      conditions: [
        "数学 Lv.2",
        "物理学 Lv.2",
        "材料科学",
        "电子与控制工程 Lv.2"
      ]
    },
    {
      id: "sixg",
      name: "6G",
      type: "目标科技",
      conditions: [
        "数学 Lv.2",
        "物理学 Lv.2",
        "计算机科学 Lv.2",
        "电子与控制工程 Lv.2"
      ]
    }
  ];

  // 当前选中的研究节点
  let selectedNodeId = "math";
  // 游戏回合状态
let currentTurn = 1;
let researchPoints = 10;

// 学科升级所需进度
function getUpgradeCost(level) {
  return level === 1 ? 8 : 12;
}

// 更新顶部的回合数和研究点
function renderGameStatus() {
  document.getElementById("turn").textContent = currentTurn;
  document.getElementById("points").textContent = researchPoints;
}

  // 找到网页中的显示区域
  const subjectsContainer = document.getElementById("subjects");
  const techMap = document.getElementById("tech-map");
  const details = document.getElementById("details");

  // 动态显示六门基础学科
function renderSubjects() {
  subjectsContainer.innerHTML = "";

  subjects.forEach((subject) => {
    const card = document.createElement("div");
    card.className = "subject-card";

    if (selectedNodeId === subject.id) {
      card.style.borderColor = "#a5b4fc";
    }

    const upgradeCost = getUpgradeCost(subject.level);

    card.innerHTML = `
      <div class="subject-name">${subject.name}</div>
      <div class="level">当前等级：Lv.${subject.level}</div>
      <div class="level">
        升级进度：${subject.progress} / ${upgradeCost}
      </div>
      <button type="button" class="select-subject">查看学科</button>
      <div class="detail-actions">
        <button type="button" class="invest-one">投入 1 点</button>
        <button type="button" class="invest-five">投入 5 点</button>
      </div>
    `;

    card.querySelector(".select-subject").addEventListener("click", () => {
      selectedNodeId = subject.id;
      renderSubjects();
      renderTechnologies();
      renderDetails();
    });

    card.querySelector(".invest-one").addEventListener("click", () => {
      investInSubject(subject.id, 1);
    });

    card.querySelector(".invest-five").addEventListener("click", () => {
      investInSubject(subject.id, 5);
    });

    subjectsContainer.appendChild(card);
  });
}
// 向基础学科投入研究点
function investInSubject(subjectId, amount) {
  const subject = subjects.find(
    (item) => item.id === subjectId
  );

  if (!subject) {
    return;
  }

  // 检查本回合的研究点是否足够
  if (researchPoints < amount) {
    alert("研究点不足！请减少投入，或结束回合进入下一轮。");
    return;
  }

  // 扣除研究点，增加学科进度
  researchPoints -= amount;
  subject.progress += amount;

  // 如果进度足够，就升级学科
  while (subject.progress >= getUpgradeCost(subject.level)) {
    subject.progress -= getUpgradeCost(subject.level);
    subject.level += 1;
  }

  // 刷新界面
  renderGameStatus();
  renderSubjects();
  renderDetails();
}

// 结束当前回合
document.getElementById("end-turn").addEventListener("click", () => {
  currentTurn += 1;

  // 上回合剩余研究点清零，新回合固定获得 10 点
  researchPoints = 10;

  renderGameStatus();
  renderSubjects();
  renderTechnologies();
  renderDetails();
});
  // 动态显示科技网络
  function renderTechnologies() {
    techMap.innerHTML = "";

    technologies.forEach((tech) => {
      const node = document.createElement("button");
      node.type = "button";
      node.className = "tech-node";

      if (selectedNodeId === tech.id) {
        node.classList.add("selected");
      }

      node.innerHTML = `
        <span>${tech.name}</span>
        <span class="tech-type">${tech.type}</span>
      `;

      node.addEventListener("click", () => {
        selectedNodeId = tech.id;
        renderTechnologies();
        renderSubjects();
        renderDetails();
      });

      techMap.appendChild(node);
    });
  }
  function showBreakthrough(eventID){


  const event =
  breakthroughEvents[eventID];


  if(!event){
    return;
  }


  document.getElementById(
    "breakthrough-tech"
  ).innerText =
  event.title;



  document.getElementById(
    "breakthrough-text"
  ).innerText =
  event.text;



  const overlay =
  document.getElementById(
  "breakthrough-overlay"
  );


  overlay.classList.add(
  "active"
  );



  setTimeout(()=>{


    overlay.classList.remove(
    "active"
    );


  },3000);


}

  // 显示所选节点的详情
  function renderDetails() {
    const subject = subjects.find(
      (item) => item.id === selectedNodeId
    );

    const tech = technologies.find(
      (item) => item.id === selectedNodeId
    );

        if (subject) {
      const upgradeCost = getUpgradeCost(subject.level);

      details.innerHTML = `
        <div class="detail-name">${subject.name}</div>
        <div class="detail-line">类型：基础学科</div>
        <div class="detail-line">当前等级：Lv.${subject.level}</div>
        <div class="detail-line">
          升级进度：${subject.progress} / ${upgradeCost}
        </div>
        <div class="detail-line">
          当前回合剩余研究点：${researchPoints}
        </div>
        <div class="detail-line">
          达到升级门槛后，学科自动升级。
        </div>
      `;
      return;
    }

    if (tech) {
      details.innerHTML = `
        <div class="detail-name">${tech.name}</div>
        <div class="detail-line">类型：${tech.type}</div>
        <div class="detail-line">当前等级：尚未开始</div>
        <div class="detail-line">
          <strong>解锁条件</strong>
        </div>
        <ul>
          ${tech.conditions.map(
            (condition) => `<li>${condition}</li>`
          ).join("")}
        </ul>
      `;
    }
  }

    // 初始化页面
  renderGameStatus();
  renderSubjects();
  renderTechnologies();
  renderDetails();
function showBreakthrough(){

    const overlay =
    document.getElementById(
    "breakthrough-overlay"
    );


    const tech =
    document.getElementById(
    "breakthrough-tech"
    );


    const text =
    document.getElementById(
    "breakthrough-text"
    );


    tech.innerHTML =
    "ARTIFICIAL GENERAL INTELLIGENCE";


    text.innerHTML =
    `
    新时代的序幕已经开启。<br><br>

    人类第一次创造出能够跨越领域、
    持续学习并自主解决复杂问题的智能系统。<br><br>

    AI时代结束。<br><br>

    AGI时代开始。
    `;


    overlay.classList.add("active");


    setTimeout(()=>{

        overlay.classList.remove("active");

    },3000);

}
</script>
</body>
</html>
